name: ci

on: [push, pull_request]

env:
  # The suite drops and recreates this database. The name ends in _test, which
  # the conftest guard requires before it will run at all.
  DZIALKI_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dzialki_test

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # V7(b) is deselected rather than skipped. It needs the gitignored anchors
      # file, which CI must never hold (D124), and a run that reports green
      # because a test skipped is the false green the gap analysis flagged.
      - name: Unit and architecture tests
        run: >-
          pytest -q --junitxml=report.xml
          -m "(unit or architecture) and not needs_local_secrets and not needs_git_history"
      - name: No test may skip in this job
        run: python scripts/assert_no_skips.py report.xml

  db:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Integration tests
        run: pytest -q --junitxml=report.xml -m "integration and not slow"
      - name: No test may skip in this job
        run: python scripts/assert_no_skips.py report.xml
